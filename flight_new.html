<style>
html, body {
   margin:0; height:100%; background:#0b0f14; 

  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: geometricPrecision;
  overflow: hidden;

  font-family: "JetBrains Mono", system-ui, monospace;



}
#map { height:100%; }


* {
  font-family: "JetBrains Mono", system-ui, monospace !important;
}

.stealth { opacity: 0.45; }

.plane {
  font-size: 34px;
  transform-origin: 50% 50%;
  filter: drop-shadow(0 6px 10px rgba(0,0,0,.4));
}


/* Leaflet div-icon square removal */
.leaflet-div-icon {
  background: none !important;
  border: none !important;
}

.bomb { font-size: 24px; }
.explosion { font-size: 30px; }

.base {
  font-size: 32px;
  filter: drop-shadow(0 4px 6px rgba(0,0,0,.5));
}

.missile{
  font-size: 30px;
  display: block;
  transform-origin: 50% 50%;
  filter: drop-shadow(0 6px 10px rgba(0,0,0,.4));
}
#hud {
  position: absolute;
  top: 14px;
  left: 14px;
  color: #e5e5e5;
  font-family: "Inter", system-ui, sans-serif;
  font-family: system-ui;
  z-index: 9999;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  letter-spacing: 0.3px;
  font-feature-settings: "tnum";

}

#nightCanvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 5000;
}

.leaflet-marker-pane {
  z-index: 6000 !important;
}

/* ===== LEVEL TITLE ===== */
#levelTitle {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.6px;
  margin-bottom: 10px;
  padding: 6px 12px;
  background: rgba(0,0,0,0.55);
  border-radius: 10px;
  box-shadow: 0 0 12px rgba(0,0,0,0.4);
}

/* ===== HUD BOX ===== */
.hud-box {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px 12px;
  background: rgba(0,0,0,0.45);
  border-radius: 12px;
  width: fit-content;
}

/* ===== ITEMS ===== */
.hud-item {
  display: grid;
  grid-template-columns: 22px auto;
  align-items: center;
  column-gap: 4px;
  padding: 5px 1px;
}


.hud-item span.bump {
  animation: bump 0.15s ease;
}

@keyframes bump {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.25); }
  100% { transform: scale(1); }
}


/* mute */
.hud-btn {
  background: none;
  border: none;
  color: white;
  cursor: pointer;
  font-size: 16px;
  opacity: 0.8;
}

.hud-btn:hover {
  opacity: 1;
}


#muteBtn {
  position: absolute;
  top: 14px;
  right: 14px;
  opacity: 0.6;
}


.hud-level {
  font-size: 13px;
  opacity: 0.8;
}

.hud-mute {
  margin-top: 6px;
  background: none;
  border: none;
  color: white;
  cursor: pointer;
  font-size: 16px;
}

.hud-item span {
  transition: transform 0.15s ease;
}

.hud-item span {
  display: inline-block;
  will-change: transform;
}

.hud-item span.bump {
  transform: scale(1.2);
}


#radar {
  position: fixed;
  right: 16px;
  bottom: 28px;
  width: 190px;
  height: 190px;
  border-radius: 50%;
  background: rgba(0,0,0,0.6);
  border: 2px solid #0f0;
  box-shadow: 0 0 15px rgba(0,255,0,0.4);
  z-index: 9999;
}
#radar canvas { width: 100%; height: 100%; }

#intro, #endScreen {
  position:fixed;
  inset:0;
  font-family:system-ui;
  text-align:center;
  z-index:99999;
}

#intro {
  background:#0b0f14;
  color:white;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:14px;
}

#endScreen {
  background:rgba(10,15,20,0.95);
  color:white;
  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:12px;
}

#endSubtitle {
  line-height: 1.8;
}

@keyframes pop {
  from { transform: scale(0.95); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}

@keyframes pulse {
  0% { box-shadow: 0 0 0 rgba(0,255,150,0.0); }
  50% { box-shadow: 0 0 14px rgba(0,255,150,0.4); }
  100% { box-shadow: 0 0 0 rgba(0,255,150,0.0); }
}

#pauseOverlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  color: #fff;
  font-size: 48px;
  font-weight: 700;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100000;
  letter-spacing: 2px;
  text-shadow: 0 0 20px rgba(0,255,150,0.6);
}

.panel {
  width: min(520px, 92vw);
  background: linear-gradient(
    180deg,
    rgba(18,22,30,0.95),
    rgba(12,15,20,0.95)
  );
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 18px 20px;
  box-shadow:
    0 20px 60px rgba(0,0,0,0.6),
    inset 0 1px 0 rgba(255,255,255,0.04);
}

#intro .panel {
  animation: fadeIn 0.4s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

#endTitle {
  font-size: 42px;
  margin-bottom: 10px;
  transition: all 0.3s ease;
}

#endTitle {
  font-size: 42px;
  margin-bottom: 10px;
  transition: all 0.3s ease;
}


.end-win {
  color: #7CFFB2;
  text-shadow: 0 0 16px rgba(0,255,150,0.45);
  animation: pop 0.4s ease-out;
}


.end-fail {
  color: #ff6b6b;
  text-shadow: 0 0 14px rgba(255,100,100,0.4);
  animation: shake 0.3s ease-out;
}


.buttonRow {
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
}

.btn {
  padding:10px 18px;
  font-size:15px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.btnPrimary {
  background: linear-gradient(180deg, #00ff99, #00cc77);
  box-shadow:
    0 0 14px rgba(0,255,150,.45),
    inset 0 1px 0 rgba(255,255,255,.3);
  font-weight: 700;
  transition: transform .15s ease, box-shadow .15s ease;
  animation: pulse 2s infinite;
}

.btnPrimary:hover {
  transform: translateY(-1px) scale(1.02);
  box-shadow: 0 0 22px rgba(0,255,150,.6);
  animation: none;
}

.btnPrimary:active {
  transform: scale(0.98);
}

.btnSecondary {
  background:#2a3342;
  color:#fff;
}

.controls {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 10px 18px;
  margin: 18px auto 8px;
  width: fit-content;
  font-size: 15px;
  opacity: .9;
}

.controls > div {
  display: contents;
}

.controls span:first-child {
  text-align: right;
  min-width: 80px;
  font-weight: 600;
}

.controls span:last-child {
  text-align: left;
  opacity: .85;
}

.progressTable {
  width: min(420px, 92%);
  margin: 16px auto 0;
}

.progressRow {
  display: grid;
  grid-template-columns: 220px 110px 70px;
  padding: 8px 4px;
  align-items: center;
}
.progressRow {
  column-gap: 24px;
}

.progressRow.header {
  font-weight: 600;
  opacity: 0.7;
  border-bottom: 1px solid rgba(255,255,255,0.15);
  margin-bottom: 6px;
}

.progressRow > div:nth-child(2),
.progressRow > div:nth-child(3) {
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.progressRow > div:first-child {
  text-align: left;
}

.progressRow:hover {
  background: rgba(255,255,255,0.04);
  border-radius: 6px;
}

.progressRow div:nth-child(2) {
  font-weight: 600;
}

.locked {
  opacity: 0.35;
  filter: grayscale(1);
}

.progressDim {
  opacity: 0.4;
}

.endBtn {
  background: linear-gradient(180deg, #00ff99, #00cc77);
  color: #000;
  font-size: 16px;
  padding: 14px 32px;
  border-radius: 10px;
  border: none;
  cursor: pointer;

  animation: pulse 2s infinite;
}

.endBtn:hover {
  animation: none;
  transform: scale(1.04);
}

.rank-gold {
  color: #ffd36a;
  text-shadow:
    0 0 6px rgba(255, 211, 106, 0.4),
    0 0 12px rgba(255, 180, 0, 0.25);
  font-weight: 600;
}

.scoreRow {
  display: flex;
  justify-content: space-between;
  width: 260px;
  margin: 6px auto;
  font-size: 16px;
  opacity: 0.85;
}

.finalScore {
  display: flex;
  justify-content: space-between;
  width: 260px;
  margin: 14px auto 0;
  font-size: 22px;
  font-weight: 600;
}

.scoreDivider {
  width: 260px;
  margin: 12px auto;
  opacity: 0.25;
}

#rankDisplay {
  margin-top: 12px;
  font-size: 26px;
  font-weight: 600;
  opacity: 0;
  transition: opacity 0.4s ease;
}

.mission-title {
  margin: 0;
  padding-top: 6px;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.6px;
  line-height: 1.35;
  text-shadow: 0 0 12px rgba(0,255,150,0.25);
}
.mission-subtitle {
  margin-top: 10px;
  margin-bottom: 22px;
  font-size: 12px;
  letter-spacing: 1.2px;
  opacity: 0.6;
  text-transform: uppercase;
}


#rankDisplay {
  font-size: 26px;
  font-weight: 600;
  color: #d4d4d4;
  text-align: center;
  margin-top: 10px;
  opacity: 0;
  transition: opacity 0.4s ease;
}


#intro::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 50% 20%, rgba(0,255,150,0.06), transparent 60%),
    linear-gradient(180deg, rgba(0,0,0,0.2), rgba(0,0,0,0.6));
  pointer-events: none;
}


select {
  width:min(420px, 90vw);
  padding:10px 12px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.15);
  background:#0f141c;
  color:#fff;
  font-size:14px;
}

select:focus {
  outline: 2px solid #00ff88;
}

.mute-btn {
  position: fixed;
  top: 14px;
  right: 14px;
  background: rgba(0,0,0,0.5);
  border: none;
  border-radius: 50%;
  padding: 8px;
  font-size: 16px;
  color: white;
  cursor: pointer;
  z-index: 10000;
  opacity: 0.6;
}

.mute-btn:hover {
  opacity: 1;
}

.hud-zero {
  color: #ff3b3b;
  font-weight: 600;
  text-shadow: 0 0 6px rgba(255, 60, 60, 0.6);
}

@keyframes pulseRed {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.15); }
  100% { transform: scale(1); }
}

.hud-zero {
  animation: pulseRed 0.8s infinite;
}

.fire-emoji {
  position: relative;
  font-size: 28px;
  animation: fireGlow 0.45s infinite;
  filter:
    drop-shadow(0 0 6px rgba(255,140,40,0.7));
  z-index: 6001;
}

body.night .fire-emoji {
  filter:
    drop-shadow(0 0 6px rgba(255,140,40,0.9))
    drop-shadow(0 0 16px rgba(255,100,30,0.6))
    drop-shadow(0 0 32px rgba(255,60,10,0.4));
  animation: fireGlow 0.4s infinite;
}

@keyframes fireGlow {
  0%   { filter: brightness(1); }
  50%  { filter: brightness(1.25); }
  100% { filter: brightness(1); }
}



</style>
</head>

<body>
<div id="map"></div>
<canvas id="nightCanvas"></canvas>


<div id="hud">

  <div id="levelTitle"></div>

  <div class="hud-box">
    <div class="hud-item">💣 <span id="hud-bombs">100</span></div>
    <div class="hud-item">🕶 <span id="hud-stealth">2</span></div>
    <div class="hud-item">🎯 <span id="hud-targets">2</span></div>
  </div>
  
</div>
<button id="muteBtn" class="mute-btn">🔊</button>



<div id="radar">
  <canvas id="radarCanvas" width="160" height="160"></canvas>
</div>

<div id="intro">
  <div class="panel">

    <h2 class="mission-title">✈️ Mission Briefing</h2>
    <div class="mission-subtitle">Operation: Air Strike</div>

    <div class="controls">
      <div><span>⬆️ ⬇️</span><span>Speed</span></div>
      <div><span>⬅️ ➡️</span><span>Turn</span></div>
      <div><span>SPACE</span><span>Drop bomb 💣</span></div>
      <div><span>Shift Left</span><span>Stealth 🕶️</span></div>
    </div>

    <div style="
      margin-top:10px;
      font-size:14px;
      line-height:1.6;
      opacity:0.9;
    ">

    <br>
    <hr style="opacity:.15; margin:12px 0;">
      🎯 Destroy all enemy targets<br>
      ⚠️ Avoid radar missiles
    </div>

    <div style="margin-top:14px;">
      <div style="opacity:0.8; font-size:13px; margin-bottom:4px;">Choose a level</div>
      <select id="levelSelect"></select>
    </div>

    <div class="buttonRow" style="margin-top:14px;">
      <button class="btn btnPrimary" id="startBtn">▶ START MISSION</button>
    </div>

    <div style="opacity:.5; font-size:12px; margin-top:8px;">
      🎮 Use arrows to select · Enter to start
    </div>
    <div id="progressTable" class="progressWrap"></div>

  </div>
</div>

<div id="endScreen"  style="
  position:fixed;
  inset:0;
  background:rgba(10,15,20,0.95);
  color:white;
  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-family:system-ui;
  text-align:center;
  z-index:99999;
">
  <h1 id="endTitle" style="margin-bottom:10px;"></h1>

  <div id="endSubtitle" style="opacity:0.85; margin-bottom:18px;"></div>

  <button id="primaryActionBtn" style="
    padding:14px 32px;
    font-size:16px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#00ff88;
    color:#000;
  " class="endBtn">
    Retry
  </button>
  <div style="margin-top:12px; font-size:13px; opacity:0.6;">
    Press Enter / Space to continue
  </div>

  <div style="margin-top:12px; font-size:13px; opacity:0.6;">
    esc for menu
  </div>
</div>

<div id="pauseOverlay">
  ⏸ PAUSED
</div>


<script>

/* ========= GAME STATES ========= */
const GAME_STATE = {
  MENU: "menu",
  PLAYING: "playing",
  GAMEOVER: "gameover"
};

let currentState = GAME_STATE.MENU;

/* ========= LEVELS (single-file, Python-ish structure) ========= */

const levelToData = {
  level_1: {
    displayName: "Level 1: The Beach",
    start: {

    },
    targetLocations: [
      { lat: 31.5195, lng: 34.4698, emoji: "☢️", size: "small" },
      { lat: 31.5195, lng: 34.4618, emoji: "☢️", size: "medium" },
      { lat: 31.5195, lng: 34.4548, emoji: "☢️", size: "big" },
      //{ lat: 31.5300, lng: 34.4700 },
    ],
    radarLocations: [
      {
        lat: 31.6195,
        lng: 34.4598,
        size: "big",

        rocketSpeed: 14000,
        rocketFreq: 0.9,
        smartRocketsEvery: 0,
        smartRocketSpeedFactor: 0.5
      },
      {
        lat: 31.6195,
        lng: 34.4598,
        size: "small",

        rocketSpeed: 14000,
        rocketFreq: 0.9,
        smartRocketsEvery: 0,
        smartRocketSpeedFactor: 0.5
      },
      {
        lat: 31.6195,
        lng: 34.4598,
        size: "medium",

        rocketSpeed: 14000,
        rocketFreq: 0.9,
        smartRocketsEvery: 0,
        smartRocketSpeedFactor: 0.5
      },
    ],
    limits: {
      maxBombs: 10,
      maxStealth: 2
    }
  },

  level_2: {
    displayName: "Level 2: Inland Fields",
    start: {
      lat: 31.5085,
      lng: 34.4538,
      heading: 0
    },

    targetCount: 3,
    targetLocations: [
      { lat: 31.5085, lng: 34.4538 },
      
			// { lat: 31.5085, lng: 34.9531 },
      //{ lat: 31.5300, lng: 34.4700 },
    ],
    radarLocations: [
      {
        lat: 31.6200,
        lng: 34.6400,
        size: "big",

        rocketSpeed: 30000,
        rocketFreq: 0.5,
        smartRocketsEvery: 5,
        smartRocketSpeedFactor: 0.6
      },
    ],
    limits: {
      maxBombs: 3,
      maxStealth: 2
    }
  },
  level_3: {
    displayName: "Level 3: The City",
    start: {
      lat: 37.60813,
      lng: -122.38023,
      heading: 90
    },
    night: true,
    targetCount: 2,
    targetLocations: [
      { lat: 37.60813, lng: -122.38093, emoji: "🏛️", size: "large" },
      { lat: 37.60813, lng: -122.31023, emoji: "🏙️", size: "large" },
      
      // { lat: 31.5085, lng: 34.9531 },
      //{ lat: 31.5300, lng: 34.4700 },
    ],
    radarLocations: [
      {
        lat: 31.6200,
        lng: 34.5400,
        size: "big",

        rocketSpeed: 20000,
        rocketFreq: 0.7,
        smartRocketsEvery: 3,
        smartRocketSpeedFactor: 0.7
      },
      {
        lat: 31.6000,
        lng: 34.6000,
        size: "medium",

        rocketSpeed: 25000,
        rocketFreq: 0.6,
        smartRocketsEvery: 4,
        smartRocketSpeedFactor: 0.6
      },
    ],
    limits: {
      maxBombs: 4,
      maxStealth: 3
    }
  },
};

const levelOrder = Object.keys(levelToData);

/* ======== Levels Memory ======== */
const STORAGE_KEY = "flight_game_progress_v1";
const SOUND_KEY = "flight_game_sound";
let soundEnabled = localStorage.getItem(SOUND_KEY) !== "off";

function loadProgress() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) {
    return {
      unlockedLevels: ["level_1"],
      scores: {}
    };
  }
  return JSON.parse(raw);
}

function saveProgress(progress) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
}

let progress = loadProgress();


/* ========= SOUND (keep empty for your copy/paste; you will fill later) ========= */

const sounds = {

};

function playSound(name) {
  if (!soundEnabled) return;

  const s = sounds[name];
  if (!s) return;

  try {
    s.pause();
    s.currentTime = 0;
    s.play().catch(() => {});
  } catch {}
}

const muteBtn = document.getElementById("muteBtn");

function updateMuteUI() {
  muteBtn.textContent = soundEnabled ? "🔊 Sound" : "🔇 Muted";
}

function toggleMute() {
  soundEnabled = !soundEnabled;
  localStorage.setItem(SOUND_KEY, soundEnabled ? "on" : "off");
  updateMuteUI();
}

function togglePause() {
  if (currentState !== GAME_STATE.PLAYING) return;
  state.paused = !state.paused;
  const overlay = document.getElementById("pauseOverlay");
  overlay.innerHTML = "⏸ PAUSED";
  overlay.style.display = state.paused ? "flex" : "none";
}


muteBtn.addEventListener("click", toggleMute);

updateMuteUI();


/* ========= CONSTANTS (defaults preserved) ========= */

const CONFIG_DEFAULTS = {
  baseRadius: 800, // meters
  minSpeed: 2500,
  maxSpeed: 8000,
  accel: 2500,
  turnRate: 140,
  emojiRotationOffset: -45,

  missileLifetime: 5.5,       // seconds
  missileHitRadius: 200,    // meters
  missileRotationOffset: -45,

  lockBeepDistance: 5000,
  lockBeepCooldown: 0.7,

  targetRadius: 800,       // meters
  radarHitRadius: 800,     // meters

  radarRangeOnMinimap: 8000
};

/* radar types (ranges doubled as in your current code) */
const RADAR_TYPES = [
  { size: "small",  range: 3500,  emoji: "📡", scale: 1 },
  { size: "medium", range: 5000,  emoji: "📡", scale: 1.5 },
  { size: "big",  range: 7500, emoji: "📡", scale: 2 }
];

function radarSizeToType(size) {
  if (size === "small") return RADAR_TYPES[0];
  if (size === "medium") return RADAR_TYPES[1];
  if (size === "big" || size === "large") return RADAR_TYPES[2];
  return RADAR_TYPES[1];

/* ========= GEO ========= */

const R = 6371000;
const rad = d => d * Math.PI / 180;
const deg = r => r * 180 / Math.PI;

function move(lat, lng, hdg, dist) {
  const d = dist / R;
  const h = rad(hdg);
  const phi1 = rad(lat), lam1 = rad(lng);

  const phi2 = Math.asin(
    Math.sin(phi1) * Math.cos(d) +
    Math.cos(phi1) * Math.sin(d) * Math.cos(h)
  );

  const lam2 = lam1 + Math.atan2(
    Math.sin(h) * Math.sin(d) * Math.cos(phi1),
    Math.cos(d) - Math.sin(phi1) * Math.sin(phi2)
  );

  return { lat: deg(phi2), lng: deg(lam2) };
}

function distance(a, b) {
  const dx = rad(b.lat - a.lat);
  const dy = rad(b.lng - a.lng);
  return Math.sqrt(dx * dx + dy * dy) * R;
}

function bearing(lat1, lon1, lat2, lon2) {
  const y = Math.sin(rad(lon2 - lon1)) * Math.cos(rad(lat2));
  const x =
    Math.cos(rad(lat1)) * Math.sin(rad(lat2)) -
    Math.sin(rad(lat1)) * Math.cos(rad(lat2)) * Math.cos(rad(lon2 - lon1));
  return (deg(Math.atan2(y, x)) + 360) % 360;
}

function applyLevelConfig(levelId) {
  const lvl = levelToData[levelId];

  state.levelId = levelId;
  state.levelIndex = levelOrder.indexOf(levelId);

  // === START POSITION ===
  const start = lvl.start || lvl.base || { lat: 31.5085, lng: 34.4538 };

  state.lat = start.lat;
  state.lng = start.lng;
  state.heading = start.heading ?? 0;

  // === BASE (OPTIONAL) ===
  if (lvl.base) {
    state.base = { ...lvl.base };
    state.hasBase = true;
  } else {
    state.base = null;
    state.hasBase = false;
  }


  state.baseRadius = CONFIG_DEFAULTS.baseRadius;

  state.maxBombs = (lvl.limits?.maxBombs ?? 10);
  state.maxStealth = (lvl.limits?.maxStealth ?? 2);

  // defaults preserved if not overridden
  const rockets = lvl.rocketsConfig || {};
  state.rocketSpeed = (rockets.rocketSpeed ?? 28000);
  state.rocketFreq = (rockets.rocketFreq ?? 1.0);
  state.smartRocketsEvery = (rockets.smartRocketsEvery ?? 5);
  state.smartRocketSpeedFactor = (rockets.smartRocketSpeedFactor ?? 0.5);


  state.lat = start.lat;
  state.lng = start.lng;
  state.heading = start.heading ?? 0;

  state.speed = CONFIG_DEFAULTS.minSpeed + 500;

  state.bombs = state.maxBombs;

function spawnTargetsForLevel(levelId) {
  const lvl = levelToData[levelId];

  // explicit target locations
  if (Array.isArray(lvl.targetLocations) && lvl.targetLocations.length > 0) {
    for (const p of lvl.targetLocations) addTarget(p);
    entities.remainingTargets = entities.targets.length;
    return;
  }

  // random target area fallback (preserves your current behavior)
  const targetArea = lvl.targetArea || {
    minLat: 31.20, maxLat: 31.55,
    minLng: 34.20, maxLng: 34.55
  };

  const count = lvl.targetCount ?? 3;

  for (let i = 0; i < count; i++) {
    const lat = targetArea.minLat + Math.random() * (targetArea.maxLat - targetArea.minLat);
    const lng = targetArea.minLng + Math.random() * (targetArea.maxLng - targetArea.minLng);
    addTarget(lat, lng);
  }

  entities.remainingTargets = entities.targets.length;
}

const SIZE_STATS = {
  small:  { hp: 1, scale: 1.5 },
  medium: { hp: 2, scale: 2 },
  big:    { hp: 3, scale: 2.5 }
};

const FIRE_SCALE_BY_SIZE = {
  small: 1.2,
  medium: 2,
  big: 2.5
};


function addTarget(target) {
  const size = target.size || "small";
  const stats = SIZE_STATS[size || "medium"] || SIZE_STATS.medium;

  const marker = L.marker([target.lat, target.lng], {
    icon: L.divIcon({
      html: `<div style="font-size:${32 * stats.scale}px">${target.emoji || "🏭"}</div>`,
      className: "",
      iconSize: [60, 60],
      iconAnchor: [30, 50]
    })
  }).addTo(layerTargets);

  entities.targets.push({
    ...target,
    hp: stats.hp,
    maxHp: stats.hp,
    size,
    marker,
    fire: null
  });
}



function spawnRadarsForLevel(levelId) {
  const lvl = levelToData[levelId];
  entities.radars.length = 0;

  // explicit radar locations
  if (Array.isArray(lvl.radarLocations) && lvl.radarLocations.length > 0) {
    for (const r of lvl.radarLocations)
      addRadar({
        lat: r.lat,
        lng: r.lng,
        size: r.size,
        rocketSpeed: r.rocketSpeed,
        rocketFreq: r.rocketFreq,
        smartRocketsEvery: r.smartRocketsEvery,
        smartRocketSpeedFactor: r.smartRocketSpeedFactor
      });
    return;
  }

  // current behavior: radars near each target, random type
  for (const t of entities.targets) {
    const type = RADAR_TYPES[Math.floor(Math.random() * RADAR_TYPES.length)];
    const offset = (type.range * 0.4) / 111000;
    const lat = t.lat + (Math.random() - 0.5) * offset;
    const lng = t.lng + (Math.random() - 0.5) * offset;
    addRadar(lat, lng, type);
  }

}


function applyDamage(entity, dmg) {
  entity.hp -= dmg;

  // צור אש רק פעם אחת
  if (!entity.fire) {
    const fireScale = FIRE_SCALE_BY_SIZE[entity.size || "medium"];
    entity.fire = fireEffect(entity, fireScale);
  }

  if (entity.hp <= 0) {
    if (entity.fire) {
      setTimeout(() => {
        layerFx.removeLayer(entity.fire);
        entity.fire = null;
      }, 4000);
    }
    return true; // destroyed
  }

  return false; // still alive
}


function addRadar(cfg) {
  const type = radarSizeToType(cfg.size);
  const stats = SIZE_STATS[cfg.size || "medium"] || SIZE_STATS.medium;

  const circle = L.circle([cfg.lat, cfg.lng], {
    radius: type.range,
    color: "red",
    fillOpacity: 0.05

  entities.radars.push({
    lat: cfg.lat,
    lng: cfg.lng,
    size: cfg.size,
    hp: stats.hp,
    maxHp: stats.hp,
    fire: null,

    range: type.range,
    marker,
    circle,
    alive: true,

    rocketSpeed: cfg.rocketSpeed ?? state.rocketSpeed,

/* ========= FX ========= */

function fireEffect(target) {
  if (!target) return;

  const pos = target.marker
    ? target.marker.getLatLng()
    : { lat: target.lat, lng: target.lng };

  const scale =
    FIRE_SCALE_BY_SIZE[target.size || "medium"] || 1.2;

  if (target.fire) {
    const el = target.fire.getElement();
    if (el) {
      el.style.fontSize = `${28 * scale}px`;
    }
    return;
  }
  if (target.fire) return;

  // 🔥 יצירה ראשונית – כבר בגודל הנכון
  const fireMarker = L.marker(pos, {
    icon: L.divIcon({

    })
  }).addTo(layerFx);

  });

}

function explosionEffect(lat, lng) {
  const boom = L.marker([lat, lng], {
    icon: L.divIcon({ html: "💥", className: "explosion" })
  }).addTo(layerFx);


  if (levelToData[state.levelId]?.night) {
    const p = map.latLngToContainerPoint([lat, lng]);
    nightBursts.push({
      x: p.x,
      y: p.y,
      t: performance.now()
    });
  }

  setTimeout(() => layerFx.removeLayer(boom), 800);
}

/* ========= BOMBS ========= */

function getBombImpactPoint() {
  const t = state.speed / CONFIG_DEFAULTS.accel;
  const dist = 0.5 * (state.speed / 3.6) * t;
  return move(state.lat, state.lng, state.heading, dist);
}

function dropBomb() {
  if (state.gameOver || !state.gameStarted) return;
  if (state.maxBombs <= 0) return;
  if (state.bombs <= 0) return;

  playSound("release_bomb");
  state.bombs--;
  updateHUD();

  const bomb = {
    lat: state.lat,
    lng: state.lng,
    heading: state.heading,
    speed: state.speed,
    marker: L.marker([state.lat, state.lng], {
      icon: L.divIcon({ html: "💣", className: "bomb" })
    }).addTo(layerBombs)
  };

  entities.bombs.push(bomb);
}

function explodeBomb(bomb) {
  layerBombs.removeLayer(bomb.marker);

  let hitSomething = false;
  let destroySomething = false;

  explosionEffect(bomb.lat, bomb.lng);

  // ===== unified damage logic (targets + radars) =====
  function checkHit(entity, radius) {
    const d = distance(bomb, entity);

    let dmg = 0;
    if (d < radius * 0.4) dmg = 1.5;
    else if (d < radius * 0.7) dmg = 1;

    if (dmg > 0) {
      hitSomething = true;
      const destroyed = applyDamage(entity, dmg);
      if (destroyed) destroySomething = true;
      return destroyed;
    }
    return false;
  }

  // targets
  for (let i = entities.targets.length - 1; i >= 0; i--) {
    const t = entities.targets[i];

    if (checkHit(t, CONFIG_DEFAULTS.targetRadius)) {
      layerTargets.removeLayer(t.marker);
      entities.targets.splice(i, 1);
      entities.remainingTargets--;

      if (entities.remainingTargets <= 0 && !state.gameOver) {
        state.gameOver = true;
        setTimeout(() => victoryHandler(), 600);
      }
    }
  }

  // radars
  for (let i = entities.radars.length - 1; i >= 0; i--) {
    const r = entities.radars[i];
    if (!r.alive) continue;

    if (checkHit(r, CONFIG_DEFAULTS.radarHitRadius)) {
      r.alive = false;
      state.destroyedRadars++;
      layerRadars.removeLayer(r.marker);
      layerRadars.removeLayer(r.circle);
    }
  }
  // 🔊 סאונד
  playSound("explode");
  if (destroySomething) {
    playSound("destroyed");   // 💥 נהרס
  } else if (hitSomething) {
    playSound("hit");         // 🔫 רק פגיעה
  }
}

/* ========= MISSILES ========= */

function launchMissile(radar) {
  state.missileCounter++;
  playSound("rocket_launch");

  const smartEnabled =
    radar.smartRocketsEvery &&
    radar.smartRocketsEvery > 0;

  const isSmart = smartEnabled
    ? (state.missileCounter % radar.smartRocketsEvery === 0)
    : false;

  const speed = isSmart
    ? radar.rocketSpeed * radar.smartRocketSpeedFactor
    : radar.rocketSpeed;

  const missile = {
    lat: radar.lat,
    lng: radar.lng,
    heading: bearing(radar.lat, radar.lng, state.lat, state.lng),
    smart: isSmart,
    speed,
    life: CONFIG_DEFAULTS.missileLifetime,
    lockBeeped: false,
    lockLost: false,
    marker: L.marker([radar.lat, radar.lng], {
      icon: L.divIcon({
        html: `<div class="missile">🚀</div>`,
        className: "",
        iconSize: [30, 30],
        iconAnchor: [15, 15]
      })
    }).addTo(layerMissiles)
  };

  entities.missiles.push(missile);
}


/* ========= SCORING ========= */

function calculateScoreBreakdown() {
  const radarScore =
    state.destroyedRadars * SCORE_RULES.radar;

  const bombsScore =
    state.bombs * SCORE_RULES.bombRemaining;

  const stealthUsed =
    state.maxStealth - state.stealthUses;

  const stealthPenalty =
    stealthUsed * SCORE_RULES.stealthPenalty;

  const total = Math.max(
    50,
    radarScore + bombsScore - stealthPenalty
  );

  return {
    radarScore,
    bombsScore,
    stealthPenalty,
    total
  };
}

function getMaxScore() {
  return (
    entities.radars.length * SCORE_RULES.radar +
    state.maxBombs * SCORE_RULES.bombRemaining
  );
}


function getRank(score) {
  const maxScore = getMaxScore();
  const ratio = score / Math.max(1, maxScore);

  if (ratio >= 0.9) return "🥇 Gold";
  if (ratio >= 0.7) return "🥈 Silver";
  return "🥉 Bronze";
}

function gameOverHandler() {
  currentState = GAME_STATE.GAMEOVER;
  const title = document.getElementById("endTitle");
  title.textContent = "MISSION FAILED";
  title.className = "end-fail";


  const destroyed =
    (levelToData[state.levelId].targetLocations?.length || 0)
    - entities.remainingTargets;

  document.getElementById("endSubtitle").innerHTML = `
    Destroyed ${destroyed} targets — ${entities.remainingTargets} left 🤦‍♂️
  `;

  const btn = document.getElementById("primaryActionBtn");
  btn.textContent = "Retry";
  btn.onclick = () => restartLevel();

  endScreenEl.style.display = "flex";
  endScreenEl.focus();
}

function goToMenu() {
  if (state.levelId) localStorage.setItem("lastPlayedLevel", state.levelId);

  state.gameStarted = false;
  state.gameOver = false;
  currentState = GAME_STATE.MENU;

  endScreenEl.style.display = "none";
  introEl.style.display = "flex";
  if (state.levelId) {
    levelSelectEl.value = state.levelId;
  }
  levelSelectEl.style.boxShadow = "0 0 0 2px rgba(0,255,150,.4)";

  levelSelectEl.focus();
}

function animateNumber(el, from, to, duration = 600) {
  const start = performance.now();

  function step(t) {
    const p = Math.min(1, (t - start) / duration);
    const value = Math.floor(from + (to - from) * p);
    el.textContent = value;
    if (p < 1) requestAnimationFrame(step);
  }

  requestAnimationFrame(step);
}


function victoryHandler() {
  state.gameOver = true;
  currentState = GAME_STATE.GAMEOVER;
  playSound("victory");
  const levelId = state.levelId;
  const nextIndex = state.levelIndex + 1;
  const nextLevel = levelOrder[nextIndex];

  // ===== SCORE =====
  const breakdown = calculateScoreBreakdown();
  const score = breakdown.total;
  const rank = getRank(score);

  // ===== SAVE PROGRESS =====
  const prev = progress.scores[levelId];

  const newScore = {
    score,
    rank,
    destroyedTargets: levelToData[levelId].targetLocations?.length ?? 0,
    destroyedRadars: state.destroyedRadars,

    bombsUsed: state.maxBombs - state.bombs,
    bombsRemaining: state.bombs,

    stealthUsed: state.maxStealth - state.stealthUses,
    stealthRemaining: state.stealthUses
  };

  const radar = state.destroyedRadars;
  const bombs = state.bombs;
  const stealth = state.stealthUses;
  const total = breakdown.total;


  let isNewRecord = false;

  if (!prev) {
    progress.scores[levelId] = newScore;
  } else if (newScore.score > prev.score) {
    progress.scores[levelId] = newScore;
    isNewRecord = true;
  }

  if (isNewRecord) {
    document.getElementById("endSubtitle").innerHTML += `
      <div style="margin-top:10px; color:#00ff88;">
        🏆 NEW RECORD
      </div>
    `;
  } else if (prev) {
    document.getElementById("endSubtitle").innerHTML += `
      <div style="opacity:0.6; margin-top:10px;">
        Best: ${prev.score}
      </div>
    `;
  }

  if (nextLevel && !progress.unlockedLevels.includes(nextLevel)) {
    progress.unlockedLevels.push(nextLevel);
  }

  saveProgress(progress);
  localStorage.setItem("lastPlayedLevel", state.levelId);
  renderProgressTable();
  populateLevelSelect();

  // ===== UI =====
  const title = document.getElementById("endTitle");
  title.textContent = "MISSION COMPLETE 🎉";
  title.className = "end-win";


  document.getElementById("endSubtitle").innerHTML = `
    <div id="scoreBreakdown">

      <div class="scoreRow">
        <span>Radar destroyed</span>
        <span id="radarCount">0</span>
      </div>

      <div class="scoreRow">
        <span>Bombs remaining</span>
        <span id="bombsCount">0</span>
      </div>

      <div class="scoreRow" id="stealthRow">
        <span>Stealth used</span>
        <span id="stealthCount">0</span>
      </div>

      <hr class="scoreDivider">

      <div class="finalScore">
        <span>Final Score</span>
        <span id="finalScore">0</span>
      </div>

      <div id="rankDisplay"></div>
    </div>


  `;

  if (isNewRecord) {
    document.getElementById("endSubtitle").innerHTML += `
      <div style="margin-top:10px; color:#00ff88; font-weight:600;">
        🏆 NEW RECORD
      </div>
    `;
  }

  const radarEl = document.getElementById("radarCount");
  const bombsEl = document.getElementById("bombsCount");
  const stealthEl = document.getElementById("stealthCount");
  const finalEl = document.getElementById("finalScore");
  const rankEl = document.getElementById("rankDisplay");

  // reset
  radarEl.textContent = "0";
  bombsEl.textContent = "0";
  stealthEl.textContent = "0";
  finalEl.textContent = "0";

  // hide stealth if 0
  if (stealth === 0) {
    document.getElementById("stealthRow").style.display = "none";
  }

  setTimeout(() => animateNumber(radarEl, 0, radar), 200);
  setTimeout(() => animateNumber(bombsEl, 0, bombs), 800);
  if (stealth > 0) {
    setTimeout(() => animateNumber(stealthEl, 0, stealth), 1200);
  }

  setTimeout(() => {
    animateNumber(finalEl, 0, total, 900);
  }, 1700);

  setTimeout(() => {
    rankEl.style.display = "block";
    rankEl.style.opacity = "1";
    rankEl.textContent = getRank(total);
  }, 2600);



  const btn = document.getElementById("primaryActionBtn");

  if (nextLevel) {
    btn.textContent = "▶ NEXT LEVEL";
    btn.onclick = () => {
      loadLevel(nextLevel);
      startGame();
    };
  } else {
    btn.textContent = "▶ BACK TO MENU";
    btn.onclick = () => goToMenu();
  }

  endScreenEl.style.display = "flex";
  endScreenEl.focus();
}


/* ========= INPUT ========= */

const keyMap = {
  KeyW: "ArrowUp",
  KeyA: "ArrowLeft",
  KeyS: "ArrowDown",
  KeyD: "ArrowRight"
};

function normCode(e) {
  return keyMap[e.code] || e.code;
}

window.addEventListener("keydown", e => {
  if (e.code === "KeyP") {
    togglePause();
    return;
  }

  if (state.paused) return;


  const code = normCode(e);
  if (currentState === GAME_STATE.MENU) {
    if (code === "ArrowUp") {
      e.preventDefault();
      moveMenuSelection(-1);
      return;
    }

    if (code === "ArrowDown") {
      e.preventDefault();
      moveMenuSelection(+1);
      return;
    }
  }

  if (code === "KeyM") {
    toggleMute();
    return;
  }

  if (code === "Escape") {
    goToMenu();
    return;
  }

  if (code === "Enter" || code === "Space") {
    e.preventDefault();

    // ✅ GAME OVER → כפתור
    if (currentState === GAME_STATE.GAMEOVER) {
      document.getElementById("primaryActionBtn")?.click();
      return;
    }

    // ✅ MENU → Start
    if (currentState === GAME_STATE.MENU) {

      if (code === "ArrowUp" || code === "ArrowDown") {
        e.preventDefault();

        const options = [...levelSelectEl.options];
        let idx = levelSelectEl.selectedIndex;

        const dir = (code === "ArrowUp") ? -1 : 1;

        while (true) {
          idx += dir;
          if (idx < 0 || idx >= options.length) break;
          if (!options[idx].disabled) {
            levelSelectEl.selectedIndex = idx;
            break;
          }
        }

        return;
      }

      if (code === "Enter" || code === "Space") {
        startBtn.click();
        return;
      }


    }

    // ✅ PLAYING → פצצה
    if (currentState === GAME_STATE.PLAYING && !state.paused) {
      dropBomb();
      return;
    }
  }

  // ===== movement only during play =====
  if (currentState !== GAME_STATE.PLAYING) return;

  if (!state.keys[code]) {
    if (code === "ShiftLeft" && state.stealthUses > 0 && !state.stealthActive) {
      state.stealthActive = true;
      state.stealthUses--;
      state.stealthTimer = 5;
      playSound("stealth");

      for (const m of entities.missiles) {
        m.smart = false;
        m.lockLost = true;
      }
    }
  }

  state.keys[code] = true;
});



window.addEventListener("keyup", e => {
  const code = normCode(e);
  state.keys[code] = false;
});

window.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    state.keys = {};
    window.focus();
  }
});

map.getContainer().addEventListener("mousedown", e => {
  e.preventDefault();
  window.focus();
});

/* ========= HUD + MINIMAP ========= */

function updateHUD() {
  setHUDValue("hud-bombs", state.bombs);
  setHUDValue("hud-stealth", state.stealthUses);
  setHUDValue("hud-targets", entities.remainingTargets);
}

function setHUDValue(id, value) {
  const el = document.getElementById(id);
  if (!el) return;

  el.textContent = value;
  el.style.color = "";
  if (id === "hud-targets" && value === 0) {
    el.style.color = "#7CFFB2";
  }
  if (
    value === 0 &&
    (id === "hud-bombs" || id === "hud-stealth")
  ) {
    el.classList.add("hud-zero");
  } else {
    el.classList.remove("hud-zero");
  }


  el.classList.remove("bump");
  void el.offsetWidth; // force reflow
  el.classList.add("bump");

}



const radarCanvas = document.getElementById("radarCanvas");
const radarCtx = radarCanvas.getContext("2d");

function getTargetsCenter() {
  let lat = 0, lng = 0;
  for (const t of entities.targets) { lat += t.lat; lng += t.lng; }
  const n = Math.max(1, entities.targets.length);
  return { lat: lat / n, lng: lng / n };
}

function drawRadar() {
  const ctx = radarCtx;
  const w = radarCanvas.width;
  const h = radarCanvas.height;
  const cx = w / 2;
  const cy = h / 2;

  ctx.clearRect(0, 0, w, h);

  // ======================
  // Radar frame
  // ======================
  ctx.strokeStyle = "#00ff00";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, cy, cx - 2, 0, Math.PI * 2);
  ctx.stroke();

  ctx.strokeStyle = "rgba(0,255,0,0.25)";
  ctx.beginPath();
  ctx.moveTo(cx, 0); ctx.lineTo(cx, h);
  ctx.moveTo(0, cy); ctx.lineTo(w, cy);
  ctx.stroke();

  // ======================
  // TARGET DOTS (IN RANGE)
  // ======================
  entities.targets.forEach(t => {
    const d = distance(state, t);
    if (d > CONFIG_DEFAULTS.radarRangeOnMinimap) return;

    const angle = Math.atan2(t.lng - state.lng, t.lat - state.lat);
    const r = (d / CONFIG_DEFAULTS.radarRangeOnMinimap) * (cx - 10);

    const x = cx + Math.sin(angle) * r;
    const y = cy - Math.cos(angle) * r;

    ctx.fillStyle = "red";
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fill();
  });

	// ======================
  // RADARS (YELLOW DOTS)
  // ======================
  entities.radars.forEach(r => {
    if (!r.alive) return;

    const d = distance(state, r);
    if (d > CONFIG_DEFAULTS.radarRangeOnMinimap) return;

    const angle = Math.atan2(r.lng - state.lng, r.lat - state.lat);
    const rPos = (d / CONFIG_DEFAULTS.radarRangeOnMinimap) * (cx - 10);

    const x = cx + Math.sin(angle) * rPos;
    const y = cy - Math.cos(angle) * rPos;

    ctx.fillStyle = "yellow";
    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI * 2);
    ctx.fill();
  });

	// ======================
  // BASE (CYAN DOT)
  // ======================

  if (state.hasBase) {
    const d = distance(state, state.base);
    if (d <= CONFIG_DEFAULTS.radarRangeOnMinimap) {
      const angle = Math.atan2(
        state.base.lng - state.lng,
        state.base.lat - state.lat
      );

      const rPos = (d / CONFIG_DEFAULTS.radarRangeOnMinimap) * (cx - 10);

      const x = cx + Math.sin(angle) * rPos;
      const y = cy - Math.cos(angle) * rPos;

      ctx.fillStyle = "#66cccc";
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ======================
  // OUT OF RANGE ARROWS
  // ======================
  entities.targets.forEach(t => {
    const d = distance(state, t);
    if (d <= CONFIG_DEFAULTS.radarRangeOnMinimap) return;

    const angle = Math.atan2(t.lng - state.lng, t.lat - state.lat);
    const r = cx - 12;

    const x = cx + Math.sin(angle) * r;
    const y = cy - Math.cos(angle) * r;

    ctx.save();
    ctx.setLineDash([6, 4]);
    ctx.strokeStyle = "#ff3333";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(x, y);
    ctx.stroke();

    ctx.setLineDash([]);

    ctx.translate(x, y);
    ctx.rotate(angle);

    ctx.fillStyle = "#ff3333";
    ctx.beginPath();
    ctx.moveTo(0, -6);
    ctx.lineTo(4, 4);
    ctx.lineTo(-4, 4);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  });

  // ======================
  // PLANE ARROW (LAST!)
  // ======================
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rad(state.heading));

  ctx.strokeStyle = "#00ff00";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, -cx + 10);
  ctx.stroke();

  ctx.fillStyle = "#00ff00";
  ctx.beginPath();
  ctx.moveTo(0, -cx + 6);
  ctx.lineTo(4, -cx + 14);
  ctx.lineTo(-4, -cx + 14);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}


function drawNight() {
  if (!isNight) {
    nightCtx.clearRect(0, 0, nightCanvas.width, nightCanvas.height);
    return;
  }

  const ctx = nightCtx;
  ctx.clearRect(0, 0, nightCanvas.width, nightCanvas.height);

  ctx.fillStyle = "rgba(0,0,0,0.89)";
  ctx.fillRect(0, 0, nightCanvas.width, nightCanvas.height);

  const p = map.latLngToContainerPoint([state.lat, state.lng]);
  const angle = (state.heading - 90) * Math.PI / 180;


  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(angle);

  const grad = ctx.createRadialGradient(0, 0, 60, 0, 0, 420);

  grad.addColorStop(0.0, "rgba(0,0,0,0)");
  grad.addColorStop(0.25, "rgba(0,0,0,0.15)");
  grad.addColorStop(0.55, "rgba(0,0,0,0.45)");
  grad.addColorStop(0.85, "rgba(0,0,0,0.8)");
  grad.addColorStop(1.0, "rgba(0,0,0,1)");

  ctx.globalCompositeOperation = "destination-out";
  ctx.fillStyle = grad;

  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.arc(0, 0, 320, -0.45, 0.45);
  //ctx.arc(0, 0, 420, -0.65, 0.65);

  ctx.closePath();
  ctx.fill();
  ctx.restore();


  // 💥 Explosion light halos
  const now = performance.now();
  for (let i = nightBursts.length - 1; i >= 0; i--) {
    const b = nightBursts[i];
    const age = (now - b.t) / 600;

    if (age > 1) {
      nightBursts.splice(i, 1);
      continue;
    }

    const r = 220 + age * 180;

    const grad = ctx.createRadialGradient(
      b.x, b.y, 0,
      b.x, b.y, r
    );

    grad.addColorStop(0, `rgba(255,200,120,${0.7 * (1 - age)})`);
    grad.addColorStop(0.5, `rgba(255,140,0,${0.35 * (1 - age)})`);

    grad.addColorStop(1, "rgba(0,0,0,0)");

    ctx.globalCompositeOperation = "destination-out";
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
    ctx.fill();
  }  
  // 🔥 Fire glow (persistent, world-locked)
  for (let i = activeFires.length - 1; i >= 0; i--) {
    const f = activeFires[i];
    const p = map.latLngToContainerPoint([f.lat, f.lng]);
    const r = 280;
    const grad = ctx.createRadialGradient(
      p.x, p.y, 0,
      p.x, p.y, r
    );

    grad.addColorStop(0.0, "rgba(0,0,0,0.65)");
    grad.addColorStop(0.4, "rgba(0,0,0,0.35)");
    grad.addColorStop(0.75, "rgba(0,0,0,0.15)");
    grad.addColorStop(1.0, "rgba(0,0,0,0)");

    ctx.globalCompositeOperation = "destination-out";
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = "source-over";
}

/* ========= GAME LOOP (logic preserved) ========= */

let last = performance.now();

function loop(t) {
  if (state.paused) {
    requestAnimationFrame(loop);
    return;
  }

  if (!state.gameStarted || state.gameOver) {
    requestAnimationFrame(loop);
    return;
  }
  const dt = Math.min(0.05, (t - last) / 1000);
  state.gameTime += dt;
  last = t;

  if (
    state.gameStarted &&
    !state.gameOver &&
    entities.remainingTargets === 0
  ) {
    victoryHandler();
  }

  if (state.gameStarted && !state.gameOver) {
    if (isNight) {
      drawNight();
    }

    // steering
    if (state.keys["ArrowLeft"])  state.heading -= CONFIG_DEFAULTS.turnRate * dt;
    if (state.keys["ArrowRight"]) state.heading += CONFIG_DEFAULTS.turnRate * dt;
    if (state.keys["ArrowUp"])    state.speed += CONFIG_DEFAULTS.accel * dt;
    if (state.keys["ArrowDown"])  state.speed -= CONFIG_DEFAULTS.accel * dt;

    state.speed = Math.max(CONFIG_DEFAULTS.minSpeed, Math.min(CONFIG_DEFAULTS.maxSpeed, state.speed));

    const pos = move(state.lat, state.lng, state.heading, (state.speed / 3.6) * dt);
    state.lat = pos.lat;
    state.lng = pos.lng;

    planeMarker.setLatLng(pos);
    map.setView(pos, map.getZoom(), { animate: false });

    const planeEl = document.getElementById("plane");
    if (planeEl) {
      planeEl.style.transform =
        `rotate(${state.heading + CONFIG_DEFAULTS.emojiRotationOffset}deg)`;

      planeEl.classList.toggle("stealth", state.stealthActive);
      planeEl.classList.toggle("night", isNight);
    }


    const impact = getBombImpactPoint();
    aimMarker.setLatLng([impact.lat, impact.lng]);

    // resupply at base
    if (state.hasBase && distance(state, state.base) < state.baseRadius) {
      if (!state.refueled) {
        state.bombs = state.maxBombs;
        state.stealthUses = state.maxStealth;
        state.refueled = true;
        playSound("fuel");
      }
    } else {
      state.refueled = false;
    }

    // stealth timer
    if (state.stealthActive) {
      state.stealthTimer -= dt;
      if (state.stealthTimer <= 0) state.stealthActive = false;
    }

    // bombs movement
    for (let i = entities.bombs.length - 1; i >= 0; i--) {
      const b = entities.bombs[i];
      b.speed -= CONFIG_DEFAULTS.accel * dt;

      if (b.speed <= 0) {
        explodeBomb(b);
        entities.bombs.splice(i, 1);
        continue;
      }

      const p = move(b.lat, b.lng, b.heading, (b.speed / 3.6) * dt);
      b.lat = p.lat;
      b.lng = p.lng;
      b.marker.setLatLng(p);
    }

    // radars firing
    for (const r of entities.radars) {
      if (!r.alive || state.stealthActive) continue;

      const d = distance(state, r);
      if (d < r.range && r.cooldown <= 0) {
        launchMissile(r);
        r.cooldown = Math.max(0.1, state.rocketFreq);
      }

      r.cooldown -= dt;
    }

    // missiles movement
    for (let i = entities.missiles.length - 1; i >= 0; i--) {
      const m = entities.missiles[i];

      m.life -= dt;
      if (m.life <= 0) {
        explosionEffect(m.lat, m.lng);
        layerMissiles.removeLayer(m.marker);
        entities.missiles.splice(i, 1);
        continue;
      }

      const d = distance(m, state);

      if (m.smart && !m.lockBeeped && d < CONFIG_DEFAULTS.lockBeepDistance &&
          (state.gameTime - state.lastLockBeep) > CONFIG_DEFAULTS.lockBeepCooldown) {
        playSound("missile_lock");
        m.lockBeeped = true;
        state.lastLockBeep = state.gameTime;
      }

      if (d < CONFIG_DEFAULTS.missileHitRadius) {
        explosionEffect(m.lat, m.lng);

        if (!state.gameOver) {
          state.gameOver = true;

          playSound("defeat");
          endScreenTimeout = setTimeout(() => {
            gameOverHandler();
          }, 900);
        }

        break;
      }


      if (m.smart && !m.lockLost) {
        m.heading = bearing(m.lat, m.lng, state.lat, state.lng);
      }
      const p = move(m.lat, m.lng, m.heading, (m.speed / 3.6) * dt);
      m.lat = p.lat;
      m.lng = p.lng;
      m.marker.setLatLng(p);

      const el = m.marker.getElement();
      if (el) {
        const inner = el.querySelector(".missile");
        if (inner) inner.style.transform = `rotate(${m.heading + CONFIG_DEFAULTS.missileRotationOffset}deg)`;
      }
    }

    updateHUD();
    drawRadar();
  }

  requestAnimationFrame(loop);
}

/* ========= START / NAV ========= */

function startGame() {
  document.activeElement.blur();
  introEl.style.display = "none";
  endScreenEl.style.display = "none";

  state.gameStarted = true;
  state.gameOver = false;
  currentState = GAME_STATE.PLAYING;
}

function restartLevel() {
  document.activeElement.blur();
  loadLevel(state.levelId);
  startGame();
}


function nextLevel() {
  const nextIndex = Math.min(levelOrder.length - 1, state.levelIndex + 1);
  loadLevel(levelOrder[nextIndex]);
}

/* intro UI */
function populateLevelSelect() {
  levelSelectEl.innerHTML = "";
  const lastPlayed = localStorage.getItem("lastPlayedLevel");

  for (const id of levelOrder) {
    const opt = document.createElement("option");
    opt.value = id;
    opt.textContent = levelToData[id].displayName;

    if (!progress.unlockedLevels.includes(id)) {
      opt.disabled = true;
      opt.textContent += " 🔒";
    }

    levelSelectEl.appendChild(opt);
  }
  if (lastPlayed && levelOrder.includes(lastPlayed)) {
    levelSelectEl.value = lastPlayed;
  } else {
    levelSelectEl.selectedIndex = 0;
  }
  if (levelSelectEl.value) {
    hudLevelEl.textContent = levelToData[levelSelectEl.value].displayName;
  }
}

populateLevelSelect();

startBtn.addEventListener("click", () => {
  loadLevel(levelSelectEl.value);
  startGame();
});

window.addEventListener("beforeunload", () => {
  if (state.levelId) {
    localStorage.setItem("lastPlayedLevel", state.levelId);
  }
});

/* ========= BOOT ========= */

(function boot() {
  renderProgressTable();
  populateLevelSelect();
  requestAnimationFrame(loop);
})();
</script>
